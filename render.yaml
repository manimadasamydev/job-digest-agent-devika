services:
  - type: cron
    name: job-digest-agent
    runtime: python
    plan: starter
    region: oregon
    schedule: "30 2,12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m job_agent
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: job-digest-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m job_agent
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
